<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="system-ui, -apple-system, sans-serif">
  <!-- Background -->
  <rect width="960" height="640" fill="#fafafa"/>

  <!-- Title -->
  <text x="480" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#1a1a1a">LibraryFinder AWS — Architecture</text>
  <text x="480" y="55" text-anchor="middle" font-size="12" fill="#666">Serverless library search application · Terraform-managed · us-east-1</text>

  <!-- Developer -->
  <g>
    <rect x="40" y="100" width="130" height="70" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="105" y="125" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Developer</text>
    <text x="105" y="145" text-anchor="middle" font-size="11" fill="#666">git push → main</text>
    <text x="105" y="160" text-anchor="middle" font-size="11" fill="#666">(VS Code + PS)</text>
  </g>

  <!-- GitHub Actions -->
  <g>
    <rect x="220" y="100" width="160" height="70" rx="6" fill="#fff" stroke="#1f2937" stroke-width="1.5"/>
    <text x="300" y="125" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">GitHub Actions</text>
    <text x="300" y="145" text-anchor="middle" font-size="11" fill="#666">terraform plan / apply</text>
    <text x="300" y="160" text-anchor="middle" font-size="11" fill="#666">OIDC → IAM role</text>
  </g>

  <!-- Arrows: dev -> GH -->
  <path d="M 170 135 L 218 135" stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- AWS Account box -->
  <rect x="40" y="210" width="880" height="400" rx="10" fill="#fff" stroke="#ff9900" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="235" font-size="13" font-weight="700" fill="#ff9900">AWS Account · us-east-1</text>

  <!-- OIDC arrow from GH to AWS -->
  <path d="M 300 170 L 300 210" stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="310" y="195" font-size="10" fill="#666" font-style="italic">OIDC federation (no stored keys)</text>

  <!-- User / Browser -->
  <g>
    <rect x="60" y="270" width="130" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="125" y="295" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">End User</text>
    <text x="125" y="313" text-anchor="middle" font-size="11" fill="#475569">Browser</text>
  </g>

  <!-- S3 -->
  <g>
    <rect x="230" y="270" width="150" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="305" y="295" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">S3 Static Hosting</text>
    <text x="305" y="313" text-anchor="middle" font-size="11" fill="#78350f">frontend (HTML/JS)</text>
  </g>

  <!-- API Gateway v2 -->
  <g>
    <rect x="420" y="270" width="170" height="60" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="505" y="295" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87">API Gateway v2</text>
    <text x="505" y="313" text-anchor="middle" font-size="11" fill="#581c87">HTTP API · CORS</text>
  </g>

  <!-- Lambda -->
  <g>
    <rect x="630" y="270" width="150" height="60" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="705" y="295" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12">Lambda</text>
    <text x="705" y="313" text-anchor="middle" font-size="11" fill="#7c2d12">search-api · Node.js</text>
  </g>

  <!-- RDS -->
  <g>
    <rect x="820" y="270" width="100" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="870" y="293" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">RDS</text>
    <text x="870" y="310" text-anchor="middle" font-size="11" fill="#14532d">PostgreSQL</text>
    <text x="870" y="323" text-anchor="middle" font-size="10" fill="#14532d">(VPC)</text>
  </g>

  <!-- Request flow arrows -->
  <path d="M 190 300 L 228 300" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 380 300 L 418 300" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 590 300 L 628 300" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M 780 300 L 818 300" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>

  <text x="475" y="258" text-anchor="middle" font-size="10" fill="#2563eb" font-style="italic">HTTPS request path</text>

  <!-- Monitoring section -->
  <text x="60" y="390" font-size="12" font-weight="700" fill="#374151">Observability &amp; Cost Controls</text>

  <!-- CloudWatch -->
  <g>
    <rect x="60" y="410" width="180" height="80" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="150" y="432" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">CloudWatch Alarms</text>
    <text x="150" y="451" text-anchor="middle" font-size="10" fill="#7f1d1d">• Lambda errors / duration / throttles</text>
    <text x="150" y="466" text-anchor="middle" font-size="10" fill="#7f1d1d">• API Gateway 5xx rate · p95 latency</text>
    <text x="150" y="481" text-anchor="middle" font-size="10" fill="#7f1d1d">5 alarms total</text>
  </g>

  <!-- SNS -->
  <g>
    <rect x="280" y="420" width="130" height="60" rx="6" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
    <text x="345" y="445" text-anchor="middle" font-size="13" font-weight="600" fill="#831843">SNS Topic</text>
    <text x="345" y="463" text-anchor="middle" font-size="11" fill="#831843">fan-out to email</text>
  </g>

  <!-- Email -->
  <g>
    <rect x="450" y="420" width="130" height="60" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="515" y="445" text-anchor="middle" font-size="13" font-weight="600" fill="#1a1a1a">Email Alerts</text>
    <text x="515" y="463" text-anchor="middle" font-size="11" fill="#666">on-call notification</text>
  </g>

  <!-- Alert flow arrows -->
  <path d="M 240 450 L 278 450" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arrowRed)"/>
  <path d="M 410 450 L 448 450" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arrowRed)"/>

  <!-- Budget -->
  <g>
    <rect x="620" y="420" width="280" height="60" rx="6" fill="#ecfccb" stroke="#65a30d" stroke-width="1.5"/>
    <text x="760" y="442" text-anchor="middle" font-size="13" font-weight="600" fill="#365314">AWS Budget — $15 / month</text>
    <text x="760" y="460" text-anchor="middle" font-size="11" fill="#365314">Alerts at 80% actual · 100% forecasted</text>
    <text x="760" y="474" text-anchor="middle" font-size="10" fill="#365314" font-style="italic">RDS kept stopped when idle</text>
  </g>

  <!-- CI/CD section -->
  <text x="60" y="525" font-size="12" font-weight="700" fill="#374151">Infrastructure as Code</text>
  <g>
    <rect x="60" y="540" width="840" height="55" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="80" y="562" font-size="12" font-weight="600" fill="#1e293b">Terraform</text>
    <text x="80" y="580" font-size="11" fill="#475569">monitoring.tf · budget.tf · lambda.tf · api-gateway.tf · rds.tf · s3.tf · vpc.tf · github-oidc.tf · variables.tf · outputs.tf</text>
    <text x="880" y="575" text-anchor="end" font-size="11" font-weight="600" fill="#16a34a">All resources version-controlled</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
</svg>
